services:
  volt-web:
    build: .
    image: lab-volt-compare:latest
    container_name: lab-volt-compare
    ports:
      - "8000:8000"
    volumes:
      - volt-data:/data
    environment:
      SECRET_KEY: change-me-in-production
      VOLT_DB_PATH: /data/volt.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  volt-data:
